# Not a monorepo -- this file exists only for allowBuilds (native build approvals)
# pnpm 10+ requires a `packages` field whenever pnpm-workspace.yaml is present
# The empty list keeps Cloudflare Workers Builds working without workspace packages
packages: []

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

overrides:
  sharp: 0.35.4

minimumReleaseAgeExclude:
  - '@cloudflare/vitest-pool-workers@0.21.2'
  - miniflare@5.20260811.0-alpha
  - wrangler@4.122.0
