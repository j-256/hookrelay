# Not a monorepo -- this file exists only for allowBuilds (native build approvals).
# pnpm 10+ requires a `packages` field whenever pnpm-workspace.yaml is present, or
# `pnpm install --frozen-lockfile` fails with "packages field missing or empty"
# (which breaks Cloudflare Workers Builds). Empty list = no workspace packages.
packages: []

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/vitest-pool-workers@0.21.2'
  - miniflare@5.20260811.0-alpha
  - wrangler@4.122.0
