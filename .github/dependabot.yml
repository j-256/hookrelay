version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "03:30"
      timezone: "America/Chicago"
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # Cloudflare workers test pool requires Vitest 4
      - dependency-name: vitest
        versions: ["5.x"]
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "03:30"
      timezone: "America/Chicago"
    groups:
      all-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
