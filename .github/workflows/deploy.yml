name: deploy production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Published release or an unreleased commit already on main
        type: choice
        options: [release, main-commit]
        default: release
        required: true
      revision:
        description: Release tag (blank for latest stable) or full main commit SHA
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: hookrelay-production
  cancel-in-progress: false

jobs:
  select:
    name: resolve deployment revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.selection.outputs.sha }}
      selection: ${{ steps.selection.outputs.selection }}
      package_version: ${{ steps.selection.outputs.package_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 11
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Resolve eligible revision
        id: selection
        run: pnpm exec tsx scripts/deployment.ts select --mode "$DEPLOY_MODE" --revision "$DEPLOY_REVISION"
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_MODE: ${{ inputs.mode }}
          DEPLOY_REVISION: ${{ inputs.revision }}

  verify:
    name: verify selected source
    needs: select
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 11
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    name: deploy and verify selected revision
    needs: [select, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 11
          runtime: node@22
          cache: false
          install: false
      - run: pnpm --dir tooling install --frozen-lockfile
      - run: pnpm --dir source install --frozen-lockfile
      - name: Check target production migrations
        id: migrations
        run: pnpm --dir tooling deploy:check --config "$GITHUB_WORKSPACE/source/wrangler.jsonc"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy selected source
        id: publish
        working-directory: source
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/hookrelay-deploy.ndjson
      - name: Read provider deployments
        id: readback
        working-directory: source
        run: pnpm exec wrangler deployments list --json > "$RUNNER_TEMP/hookrelay-deployments.json"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Match active provider version
        id: receipt
        run: pnpm --dir tooling exec tsx scripts/deployment.ts verify --config "$GITHUB_WORKSPACE/source/wrangler.jsonc" --output "$RUNNER_TEMP/hookrelay-deploy.ndjson" --deployments "$RUNNER_TEMP/hookrelay-deployments.json"
      - name: Record deployment outcome
        if: always()
        env:
          SELECTION: ${{ needs.select.outputs.selection }}
          SOURCE_SHA: ${{ needs.select.outputs.sha }}
          PACKAGE_VERSION: ${{ needs.select.outputs.package_version }}
          MIGRATIONS: ${{ steps.migrations.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          READBACK: ${{ steps.readback.outcome }}
          RECEIPT: ${{ steps.receipt.outcome }}
        run: |
          {
            printf 'Selection: %s\n\nSource commit: %s\n\nPackage version: %s\n\n' "$SELECTION" "$SOURCE_SHA" "$PACKAGE_VERSION"
            printf 'Workflow commit: %s\n\nActor: %s\n\nRun: %s\n\n' "$GITHUB_SHA" "$GITHUB_ACTOR" "$GITHUB_RUN_ID"
            printf 'Migration preflight: %s\n\nDeploy command: %s\n\nProvider readback: %s\n\nReceipt match: %s\n\n' "$MIGRATIONS" "$PUBLISH" "$READBACK" "$RECEIPT"
            printf 'A failed deployment or readback may have changed production. Inspect provider state before retrying.\n\nRuntime health and configuration sync require operator verification.\n'
          } >> "$GITHUB_STEP_SUMMARY"
