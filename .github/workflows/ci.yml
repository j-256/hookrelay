name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 11
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - run: npm ci --prefix tools/cover
      - run: npm exec --prefix tools/cover -- playwright install --with-deps chromium
      - run: npm run capture:cover
      - name: Retain generated project cover
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: project-cover
          path: docs/screenshots/cover.png
          if-no-files-found: error
          retention-days: 7

  publish-cover:
    name: Publish project cover
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.test.result == 'success' }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: project-cover
          path: ${{ runner.temp }}/project-cover
      - name: Open a checked cover pull request
        env:
          GH_TOKEN: ${{ github.token }}
          COVER_WORKFLOWS: ci.yml
          COVER_ARTIFACT: ${{ runner.temp }}/project-cover/cover.png
        run: |
          set -eu
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer source commit superseded this cover; its build owns publication."
            exit 0
          fi
          cp "$COVER_ARTIFACT" docs/screenshots/cover.png
          if git diff --quiet -- docs/screenshots/cover.png; then
            echo "Project cover is unchanged."
            exit 0
          fi
          branch="automation/project-cover-${GITHUB_SHA}"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
            git fetch origin "$branch"
            changed_paths="$(git diff --name-only "$GITHUB_SHA" FETCH_HEAD)"
            test "$changed_paths" = docs/screenshots/cover.png
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- docs/screenshots/cover.png
            git commit -m 'docs: refresh generated project cover' -- docs/screenshots/cover.png
            git push origin "HEAD:refs/heads/$branch"
          fi
          pr_url="$(gh pr list --head "$branch" --base main --json url --jq '.[0].url // empty')"
          if [ -z "$pr_url" ]; then
            body_file="$RUNNER_TEMP/cover-pr.md"
            cat > "$body_file" <<EOF
          Refresh the project cover from the verified source build. This pull request changes only the generated screenshot.

          Capture: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
            pr_url="$(gh pr create --base main --head "$branch" --title 'docs: refresh generated project cover' --body-file "$body_file")"
          fi
          pr_number="$(gh pr view "$pr_url" --json number --jq .number)"
          checked_head="$(node scripts/start-cover-checks.mjs "$pr_number")"
          gh pr merge "$pr_url" --auto --squash --match-head-commit "$checked_head"
